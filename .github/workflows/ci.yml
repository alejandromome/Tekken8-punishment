on:
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: get-repository
        uses: actions/checkout@v4
      - name: get-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: run-tests
        working-directory: ./backend
        run: ./mvnw test